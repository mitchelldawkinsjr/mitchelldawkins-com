<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="system-ui, -apple-system, sans-serif">
  <rect width="920" height="360" fill="#f8fafc" rx="12"/>
  <text x="460" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Rubric codes added for year two</text>
  <text x="460" y="52" text-anchor="middle" font-size="11" fill="#64748b">Code Counts on the hub now match the film sheet. Players see the same legend.</text>

  <rect x="24" y="76" width="280" height="248" rx="8" fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="164" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">EP  Extra Point +2</text>
  <text x="164" y="140" text-anchor="middle" font-size="11" fill="#334155">Finish the drive. Red-zone</text>
  <text x="164" y="158" text-anchor="middle" font-size="11" fill="#334155">conversion is its own habit,</text>
  <text x="164" y="176" text-anchor="middle" font-size="11" fill="#334155">not a leftover TD tag.</text>
  <text x="164" y="214" text-anchor="middle" font-size="11" fill="#64748b">Positive key-play code.</text>
  <text x="164" y="232" text-anchor="middle" font-size="11" fill="#64748b">Shows in WHAT YOU DID WELL.</text>
  <text x="164" y="270" text-anchor="middle" font-size="11" fill="#166534">How to score well: Finish drives</text>
  <text x="164" y="288" text-anchor="middle" font-size="11" fill="#166534">Touchdowns +15; EP +2</text>

  <rect x="320" y="76" width="280" height="248" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="460" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">LF  Lack of Focus -0.5</text>
  <text x="460" y="140" text-anchor="middle" font-size="11" fill="#334155">Not a missed assignment.</text>
  <text x="460" y="158" text-anchor="middle" font-size="11" fill="#334155">A next-play reset miss:</text>
  <text x="460" y="176" text-anchor="middle" font-size="11" fill="#334155">eyes down, late to the ball.</text>
  <text x="460" y="214" text-anchor="middle" font-size="11" fill="#64748b">Small enough to log every week.</text>
  <text x="460" y="232" text-anchor="middle" font-size="11" fill="#64748b">Big enough to coach.</text>
  <text x="460" y="270" text-anchor="middle" font-size="11" fill="#92400e">Report cue: stay locked in,</text>
  <text x="460" y="288" text-anchor="middle" font-size="11" fill="#92400e">assignment first, next-play reset</text>

  <rect x="616" y="76" width="280" height="248" rx="8" fill="#fff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="756" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">BBL  Body Language -0.5</text>
  <text x="756" y="140" text-anchor="middle" font-size="11" fill="#334155">Chin down after a drop is</text>
  <text x="756" y="158" text-anchor="middle" font-size="11" fill="#334155">visible on film. It used to</text>
  <text x="756" y="176" text-anchor="middle" font-size="11" fill="#334155">disappear into a comment.</text>
  <text x="756" y="214" text-anchor="middle" font-size="11" fill="#64748b">Now it is a code the sheet,</text>
  <text x="756" y="232" text-anchor="middle" font-size="11" fill="#64748b">PDF, and hub all count.</text>
  <text x="756" y="270" text-anchor="middle" font-size="11" fill="#991b1b">Report cue: chin up, sprint</text>
  <text x="756" y="288" text-anchor="middle" font-size="11" fill="#991b1b">back, energy for teammates</text>
</svg>
