<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
<title id="title">What a free static website does and does not include</title>
<desc id="desc">Hosting with GitHub Free and Cloudflare Pages Free plus a pages.dev address is available at zero cost under plan limits; AI subscriptions, custom domains, and dynamic site features may have costs.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6fafb"/><stop offset="1" stop-color="#eaf2ff"/></linearGradient></defs>
<rect width="1100" height="440" rx="18" fill="url(#bg)"/>
<text x="58" y="62" font-family="system-ui,sans-serif" font-size="29" font-weight="800" fill="#102f4e">What does "free" really mean?</text>
<text x="59" y="93" font-family="system-ui,sans-serif" font-size="16" fill="#52718a">A static brochure site can avoid a hosting bill. Some extras cannot.</text>
<g font-family="system-ui,sans-serif">
 <rect x="54" y="132" width="480" height="242" rx="18" fill="#e7faf0" stroke="#6dc6a0" stroke-width="2"/>
 <rect x="72" y="149" width="100" height="37" rx="18" fill="#149365"/>
 <text x="122" y="175" text-anchor="middle" font-weight="800" font-size="16" fill="#ffffff">$0 tier</text>
 <text x="75" y="216" font-size="24" font-weight="800" fill="#11553c">Static-site essentials</text>
 <g fill="#226a4f" font-size="17">
  <text x="77" y="256">GitHub Free repository</text>
  <text x="77" y="294">Cloudflare Pages Free hosting</text>
  <text x="77" y="332">Provided pages.dev URL + HTTPS</text>
 </g>
 <g stroke="#109a6b" stroke-width="3" fill="none" stroke-linecap="round"><path d="M444 247 l7 7 l12 -15"/><path d="M444 285 l7 7 l12 -15"/><path d="M444 323 l7 7 l12 -15"/></g>
 <rect x="565" y="132" width="481" height="242" rx="18" fill="#fff7e8" stroke="#ebc48a" stroke-width="2"/>
 <rect x="584" y="149" width="153" height="37" rx="18" fill="#c2842d"/>
 <text x="660" y="174" text-anchor="middle" font-weight="800" font-size="16" fill="#ffffff">May cost extra</text>
 <text x="585" y="216" font-size="24" font-weight="800" fill="#764b1b">Beyond static hosting</text>
 <g fill="#875a31" font-size="17">
  <text x="585" y="256">AI plan or usage</text>
  <text x="585" y="294">A purchased custom domain</text>
  <text x="585" y="332">Forms, checkout, databases, logins</text>
 </g>
 <g stroke="#c48a42" stroke-width="2" fill="none"><circle cx="998" cy="247" r="10"/><path d="M998 242 v8 m0 3 v1"/><circle cx="998" cy="285" r="10"/><path d="M998 280 v8 m0 3 v1"/><circle cx="998" cy="323" r="10"/><path d="M998 318 v8 m0 3 v1"/></g>
</g>
<text x="550" y="413" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#5a728b">Free plans have usage limits. Pricing and terms can change.</text>
</svg>