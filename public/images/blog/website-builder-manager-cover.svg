<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">An owner-approved website publishing pipeline</title>
<desc id="desc">Illustrated website interface with connected chat, code, preview, and live hosting stages on dark blue</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07152f"/><stop offset=".55" stop-color="#0b2450"/><stop offset="1" stop-color="#102f48"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#41c3f3"/><stop offset="1" stop-color="#3875db"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8ef3df"/><stop offset="1" stop-color="#34bea8"/></linearGradient>
  <linearGradient id="monitor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#dae7f9"/></linearGradient>
  <filter id="shadow" x="-25%" y="-30%" width="150%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020a15" flood-opacity=".52"/></filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M 44 0 L 0 0 0 44" fill="none" stroke="#83baf5" stroke-opacity=".085"/></pattern>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect width="1200" height="675" fill="url(#grid)"/>
<circle cx="990" cy="80" r="260" fill="#40dbdc" opacity=".06"/>
<circle cx="120" cy="520" r="300" fill="#3f81fa" opacity=".08"/>
<text x="75" y="85" font-family="system-ui,sans-serif" font-size="18" letter-spacing="4" font-weight="700" fill="#6bdac7">LOW TO NO COST SOLUTIONS</text>
<text x="75" y="148" font-family="system-ui,sans-serif" font-size="45" font-weight="800" fill="#f6fbff">Your website. Your approval.</text>
<text x="76" y="188" font-family="system-ui,sans-serif" font-size="21" fill="#9db8db">From a chat request to a published static site</text>
<!-- Site preview laptop -->
<g filter="url(#shadow)">
  <rect x="74" y="243" width="628" height="316" rx="18" fill="#081426" stroke="#7396cf" stroke-width="3"/>
  <rect x="91" y="261" width="594" height="280" rx="10" fill="url(#monitor)"/>
  <rect x="91" y="261" width="594" height="33" rx="10" fill="#e5edfa"/>
  <circle cx="115" cy="278" r="5" fill="#f3818c"/><circle cx="132" cy="278" r="5" fill="#ffcf7f"/><circle cx="149" cy="278" r="5" fill="#6fce9f"/>
  <rect x="184" y="271" width="260" height="14" rx="7" fill="#cbd9ef"/>
  <rect x="118" y="329" width="250" height="22" rx="10" fill="#1d3b65"/>
  <rect x="118" y="364" width="215" height="12" rx="6" fill="#8ea8ce"/>
  <rect x="118" y="386" width="244" height="12" rx="6" fill="#b1c4df"/>
  <rect x="118" y="423" width="132" height="37" rx="18" fill="url(#blue)"/>
  <text x="184" y="447" font-family="system-ui,sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff">Get started</text>
  <rect x="414" y="322" width="237" height="170" rx="14" fill="#153b6b"/>
  <circle cx="542" cy="360" r="27" fill="#fbbe74"/>
  <path d="M432 464 L485 407 L519 442 L567 392 L639 464 Z" fill="#227fb8"/>
  <path d="M444 464 L500 417 L537 458 L587 420 L642 464 Z" fill="#2fc5a5"/>
  <path d="M389 568 L717 568 L764 588 Q766 598 748 601 L56 601 Q39 596 49 587 L75 568 Z" fill="#638eb8"/>
  <path d="M318 576 H468 L456 582 H330 Z" fill="#2d547e"/>
</g>
<!-- Floating approval chain -->
<g font-family="system-ui,sans-serif" filter="url(#shadow)">
  <rect x="768" y="248" width="368" height="72" rx="16" fill="#173862" stroke="#4779ab"/>
  <rect x="790" y="263" width="44" height="44" rx="12" fill="#275a99"/>
  <path d="M802 281 L812 273 L822 281 L812 289 Z M800 292 L823 292" stroke="#9bddfc" stroke-width="3" fill="none"/>
  <text x="854" y="279" font-size="21" font-weight="700" fill="white">Ask for an update</text>
  <text x="854" y="301" font-size="14" fill="#b4d1ec">Plain English request</text>
  <path d="M949 320 V344" stroke="#68d7df" stroke-width="3" stroke-dasharray="5 6"/>
  <rect x="768" y="344" width="368" height="72" rx="16" fill="#173862" stroke="#4779ab"/>
  <rect x="790" y="359" width="44" height="44" rx="12" fill="#275a99"/>
  <path d="M806 379 L799 385 L806 391 M819 379 L826 385 L819 391" stroke="#9bddfc" stroke-width="3" fill="none"/>
  <text x="854" y="375" font-size="21" font-weight="700" fill="white">Preview the change</text>
  <text x="854" y="397" font-size="14" fill="#b4d1ec">Review before publishing</text>
  <path d="M949 416 V440" stroke="#68d7df" stroke-width="3" stroke-dasharray="5 6"/>
  <rect x="768" y="440" width="368" height="72" rx="16" fill="#0e4e56" stroke="#4bdabf"/>
  <circle cx="812" cy="477" r="20" fill="#2ac39c"/>
  <path d="M801 477 L809 485 L824 468" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
  <text x="854" y="470" font-size="21" font-weight="700" fill="#f3fffc">Approve and publish</text>
  <text x="854" y="492" font-size="14" fill="#b5e9e0">Owner decides what goes live</text>
</g>
<text x="76" y="647" font-family="system-ui,sans-serif" font-size="15" fill="#89a8cd">GitHub + Cloudflare Pages   |   static-site hosting can be $0</text>
</svg>